<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Troop Translations</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .table-wrap { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
    table { width: 100%; border-collapse: collapse; background: #111; color: #eee; }
    th, td { padding: 8px 10px; border: 1px solid #2a2a2a; text-align: left; }
    th { background: #1e1e1e; position: sticky; top: 0; z-index:1; }
    input.search { width: 100%; padding: 10px; margin-bottom: 14px; border-radius:6px; border:1px solid #333; background:#222; color:#eee; }
    .meta { margin-bottom: 10px; color:#aaa; }
    .download-btn { display:inline-block; margin-top:10px; padding:8px 14px; background:#E50914; color:#fff; text-decoration:none; border-radius:6px; }

    /* NEW: Styles for clickable and sorted headers */
    th.sortable {
      cursor: pointer;
      user-select: none; /* Prevents text selection when clicking */
    }
    th.sortable:hover {
      background: #333;
    }
    /* NEW: Styles for the sort direction indicator arrow */
    th.sort-asc::after,
    th.sort-desc::after {
      content: '';
      display: inline-block;
      margin-left: 5px;
      opacity: 0.7;
    }
    th.sort-asc::after { content: ' ▲'; }
    th.sort-desc::after { content: ' ▼'; }
  </style>
</head>
<body>
  <div class="table-wrap container">
    <h1>Troop Translations</h1>
    <p class="meta">Loaded from <code>content/troop_translations.csv</code>. Use the filter box to search by id or name. Click on a column header to sort. Please take note with caution; there is no guarantee that the translations are correct.</p>

    <input class="search" id="filter" placeholder="Filter (id, singular, plural, english name)..." />

    <div id="count" class="meta"></div>
    <a class="download-btn" href="content/troop_translations.csv" download>Download CSV</a>

    <div style="overflow:auto; margin-top:10px;">
      <table id="troop-table">
        <thead>
          <tr>
            <!-- NEW: Added a class to make headers identifiable -->
            <th class="sortable">Troop-ID</th>
            <th class="sortable">Singular</th>
            <th class="sortable">Plural</th>
            <th class="sortable">Source Language</th>
            <th class="sortable">English</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script>
    // Fetch and parse a simple CSV (no external libs)
    async function loadCSV(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error('Failed to fetch CSV: ' + res.status);
      const text = await res.text();
      const lines = text.split(/\r?\n/).filter(Boolean);
      // Split by commas, but handle quoted fields roughly
      const rows = lines.map(line => {
        const cols = [];
        let cur = '';
        let inQuote = false;
        for (let i=0;i<line.length;i++) {
          const ch = line[i];
          if (ch === '"' || ch === "'") {
            inQuote = !inQuote;
            continue;
          }
          if (ch === ',' && !inQuote) {
            cols.push(cur.trim());
            cur = '';
            continue;
          }
          cur += ch;
        }
        if (cur.length) cols.push(cur.trim());
        return cols;
      });
      return rows;
    }

    function render(rows) {
      const tbody = document.querySelector('#troop-table tbody');
      tbody.innerHTML = '';
      for (const r of rows) {
        const tr = document.createElement('tr');
        const [id='', singular='', plural='', lang='', english=''] = r.concat([]).slice(0,5);
        tr.innerHTML = `<td>${escapeHTML(id)}</td><td>${escapeHTML(singular)}</td><td>${escapeHTML(plural)}</td><td>${escapeHTML(lang)}</td><td>${escapeHTML(english)}</td>`;
        tbody.appendChild(tr);
      }
      document.getElementById('count').textContent = `${rows.length} rows`;
    }

    function escapeHTML(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    (async () => {
      try {
        const csvPath = 'content/troop_translations.csv';
        const rows = await loadCSV(csvPath);
        const first = rows[0] || [];
        const isHeader = first.length && !/^[a-z0-9_]+$/i.test(first[0]);
        const data = isHeader ? rows.slice(1) : rows;

        // NEW: State variables to track sorting
        let sortColumn = -1; // -1 means no column is sorted
        let sortDirection = 'asc'; // 'asc' or 'desc'

        render(data); // Initial render

        const input = document.getElementById('filter');
        const headers = document.querySelectorAll('#troop-table .sortable');

        // NEW: Function to apply filter and re-render the table
        // This is needed so both filtering and sorting can trigger a table update
        function updateTable() {
          const q = input.value.trim().toLowerCase();
          const filteredData = !q
            ? data // If no filter, use the full (sorted) data
            : data.filter(cols => cols.join(' ').toLowerCase().includes(q));
          render(filteredData);
        }

        input.addEventListener('input', updateTable);

        // NEW: Add click listeners to each sortable header
        headers.forEach((header, index) => {
          header.addEventListener('click', () => {
            // Remove sort indicator classes from all other headers
            headers.forEach(h => h.classList.remove('sort-asc', 'sort-desc'));

            // Determine sort direction
            if (sortColumn === index) {
              sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
              sortColumn = index;
              sortDirection = 'asc';
            }

            // Add the appropriate class to the clicked header for visual feedback
            header.classList.add(sortDirection === 'asc' ? 'sort-asc' : 'sort-desc');

            // Sort the main data array
            data.sort((a, b) => {
              const valA = a[sortColumn] || '';
              const valB = b[sortColumn] || '';

              // Use localeCompare for robust string comparison
              const comparison = valA.localeCompare(valB, undefined, { numeric: true, sensitivity: 'base' });

              // Reverse the result if sorting in descending order
              return comparison * (sortDirection === 'asc' ? 1 : -1);
            });

            // Re-apply the filter and render the newly sorted data
            updateTable();
          });
        });

      } catch (err) {
        console.error(err);
        document.querySelector('.table-wrap').innerHTML = '<p style="color:tomato">Error loading CSV: '+err.message+'</p>';
      }
    })();
  </script>
</body>
</html>
