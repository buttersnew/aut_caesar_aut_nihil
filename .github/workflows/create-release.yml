name: Create Release

on:
  push:
    branches: ["main"]
    paths:
      - 'version.txt' # Only run when the version file changes

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # This is required to create a release and upload assets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from file
        id: version
        run: echo "TAG=$(cat version.txt)" >> $GITHUB_OUTPUT

      - name: Zip the mod folder
        run: |
          zip -r ACAN-v${{ steps.version.outputs.TAG }}.zip Aut_Caesar_Aut_Nihil

      - name: List files in workspace
        run: ls -R

      - name: Create Release
        id: create_prerelease
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.TAG }}
          release_name: Version ${{ steps.version.outputs.TAG }} (release)
          body: |
            Automated release based on changes to the version file.
            This is the stable release from main branch.
          draft: false
          prerelease: false # This marks it as a release!

      - name: Upload Mod Zip to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_prerelease.outputs.upload_url }}
          asset_path: ./ACAN-v${{ steps.version.outputs.TAG }}.zip
          asset_name: ACAN-v${{ steps.version.outputs.TAG }}.zip
          asset_content_type: application/zip

      - name: Upload Handbook PDF to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_prerelease.outputs.upload_url }}
          asset_path: ./handbook/aut_ceasar_aut_nihil_handbook.pdf
          asset_name: aut_ceasar_aut_nihil_handbook.pdf
          asset_content_type: application/pdf